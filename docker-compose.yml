version: "3.9"

services:
  app:
    build: .
    container_name: jet2holidays_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: always
  
  mongo:
    image: mongo:7
    container_name: jet2holidays_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    
volumes:
  mongo_data:
    